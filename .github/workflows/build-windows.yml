name: Build installer

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip uninstall -y opencv-python opencv-python-headless
          pip install --force-reinstall --no-deps opencv-contrib-python-headless

      - name: Smoke test
        run: python -c "import cv2, ezdxf, shapely, PySide6, rapidocr_onnxruntime; assert hasattr(cv2.ximgproc, 'thinning'); print('ok')"

      - name: Model loads
        run: python -c "from p2c.engine import neural as N; assert N.available(); N._session(); print('model ok')"

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q tests

      - name: Build Plan2CAD.exe
        run: pyinstaller --noconfirm Plan2CAD.spec

      - name: Build Plan2CAD_Setup.exe
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: Plan2CAD_Setup
          path: output/Plan2CAD_Setup.exe

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Plan2CAD 1.0.${{ github.run_number }}
          make_latest: true
          files: output/Plan2CAD_Setup.exe
          body: |
            **Plan2CAD** — Essam Nawafleh — عصام النوافلة

            نزّل `Plan2CAD_Setup.exe` تحت، ودبل كليك عليه لتثبيت البرنامج.
            Download `Plan2CAD_Setup.exe` below and double-click it to install.
